server {
    listen 80;
    listen [::]:80;
    server_name newscrawler.wildcar.org;

    location /static/ {
        alias /opt/posinus/crawler/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Illustrations from the pipeline's private media directory. Internal: only
    # reachable through an X-Accel-Redirect that Django issues after checking the
    # login. Nginx must be in group posinus to read these files.
    location /_pipeline_media/ {
        internal;
        alias /var/lib/posinus/pipeline/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # The translation action calls the model router synchronously; 60s cut
        # it off with a 504 while the model kept working.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
